version: '3.8'

networks:
  flink_flink-network:
    # `external: true` : tells Docker Compose not to create it, use existing
    external: true

services:
  producer:
    container_name: dataweave-producer
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xms1g -Xmx2g -XX:+UseG1GC"
    # ports are ignored when using network_mode as host
    #    ports:
    #      - "9112:9111"
    volumes:
      - ./logs/web:/app/logs
    networks:
      - flink_flink-network