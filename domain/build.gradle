plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.github.davidmc24.gradle.plugin.avro' version '1.9.1'
}

group = 'com.dataweave'
version = '0.0.1'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()

    maven {
        url "https://packages.confluent.io/maven/"
    }
}

avro {
    fieldVisibility = 'PRIVATE'
    stringType = 'String'
    outputCharacterEncoding = 'UTF-8'
    createSetters = true
}

dependencies {

    // Generated Avro classes depend on these
    api 'org.apache.avro:avro:1.11.3'

    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'

    // Validation
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'
    implementation 'org.glassfish:jakarta.el:4.0.2'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
}


/*
 * Tell the Avro plugin where your .avsc files are.
 */
tasks.named("generateAvroJava") {
    source("src/main/java/com/dataweave/avro")
}


/*
 * Make generated sources visible to Java compilation and IntelliJ.
 */
sourceSets {
    main {
        java {
            srcDirs += [
                    "$buildDir/generated-main-avro-java"
            ]
        }
    }
}


publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            groupId = project.group
            artifactId = project.name
            version = project.version
        }
    }
}


tasks.withType(Test).configureEach {
    useJUnitPlatform()
}